name: Bug report
description: Something in the library, the skill or a tool fails or behaves wrongly.
labels: [bug]
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Before you post
      options:
        - label: This is about the code or docs in this repository, not a request for someone to make a video, and not a song, lyrics or a link.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked for, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. powershell -ExecutionPolicy Bypass -File skills/lemo-opuscar/scripts/setup.ps1 deps
        2. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error output
      description: Paste the error text or the end of the log.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: System and versions
      placeholder: macOS 15 / Windows 11 / Ubuntu 24.04; node 22; ffmpeg 7.1; Antigravity IDE / CLI
    validations:
      required: true
  - type: input
    id: style
    attributes:
      label: Style (if any)
      placeholder: impasto / watercolor
