name: Idea or question
description: A suggestion for the library, a style, the docs, or a question about how to use them.
labels: [enhancement]
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Before you post
      options:
        - label: This is about this repository, not a request for someone to make a video, and not a song, lyrics or a link.
          required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea or question
      description: What you want, and why it would help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you tried
      description: Which style, which agent, what you looked at in the docs.
    validations:
      required: true
